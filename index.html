<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Sudheer Kumar | Official</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:"Inter",Arial,sans-serif;
    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;

    background:
    radial-gradient(
        circle at 50% -5%,
        rgba(255,255,255,.13),
        transparent 34%
    ),
    linear-gradient(
        180deg,
        #101114 0%,
        #050505 35%,
        #000 100%
    );
}

body::after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    top:-220px;
    left:50%;
    transform:translateX(-50%);

    border-radius:50%;

    background:rgba(255,255,255,.05);
    filter:blur(90px);

    z-index:-1;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:100%;
    max-width:620px;
    margin:auto;

    padding:32px 16px 45px;
}


/* =========================
   PROFILE
========================= */

.profile{
    text-align:center;
    padding:5px 10px 30px;

    animation:profileIn .8s ease both;
}


/* PROFILE IMAGE */

.profile-image{
    width:108px;
    height:108px;

    display:block;
    margin:auto;

    object-fit:cover;

    border-radius:50%;

    padding:3px;

    background:#111;

    border:2px solid rgba(255,255,255,.85);

    box-shadow:
        0 0 0 5px rgba(255,255,255,.025),
        0 12px 35px rgba(0,0,0,.7);
}


/* NAME */

.profile-name{
    margin-top:17px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;

    font-size:30px;
    font-weight:800;

    letter-spacing:-.8px;
}


/* VERIFIED */

.verified{
    width:21px;
    height:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#fff;
    color:#000;

    font-size:11px;

    box-shadow:
        0 0 12px rgba(255,255,255,.15);
}


/* WELCOME */

.welcome{
    margin-top:9px;

    color:#ddd;

    font-size:14px;
    font-weight:500;
}


/* =========================
   LINKS
========================= */

.links{
    display:flex;
    flex-direction:column;
    gap:14px;

    animation:linksIn .9s ease both;
}


/* =========================
   LINK BUTTON
========================= */

.link-card{
    position:relative;

    width:100%;
    min-height:76px;

    display:flex;
    align-items:center;

    padding:9px 55px 9px 10px;

    border-radius:40px;

    text-decoration:none;
    color:#fff;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.18),
        rgba(255,255,255,.075)
    );

    border:1px solid rgba(255,255,255,.28);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.12),
        0 8px 24px rgba(0,0,0,.45);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}


/* HOVER */

.link-card:hover{
    transform:translateY(-3px);

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.23),
        rgba(255,255,255,.09)
    );

    border-color:rgba(255,255,255,.55);

    box-shadow:
        0 14px 32px rgba(0,0,0,.6),
        0 0 20px rgba(255,255,255,.035);
}


/* CLICK */

.link-card:active{
    transform:scale(.985);
}


/* =========================
   BLACK & WHITE ICON
========================= */

.link-icon{
    width:56px;
    height:56px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    /* PURE BLACK & WHITE */

    background:#080808;

    color:#fff;

    border:1px solid rgba(255,255,255,.45);

    box-shadow:
        inset 0 0 14px rgba(255,255,255,.035),
        0 2px 8px rgba(0,0,0,.5);

    transition:.25s;
}


/* ICON */

.link-icon i{
    font-size:23px;

    color:#fff;

    transition:.25s;
}


/* ICON HOVER */

.link-card:hover .link-icon{
    background:#fff;
    border-color:#fff;
}

.link-card:hover .link-icon i{
    color:#000;
}


/* =========================
   BUTTON TEXT
========================= */

.link-title{
    flex:1;

    text-align:center;

    font-size:16px;
    font-weight:700;

    letter-spacing:.3px;

    text-transform:none;
}


/* =========================
   THREE DOTS
========================= */

.more{
    position:absolute;

    right:20px;

    width:20px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#aaa;

    font-size:17px;

    transition:.25s;
}

.link-card:hover .more{
    color:#fff;
}


/* =========================
   SHARE BUTTON
========================= */

.share{
    display:flex;
    justify-content:center;

    margin-top:30px;
}

.share-btn{
    display:flex;
    align-items:center;
    gap:8px;

    padding:12px 21px;

    border-radius:30px;

    background:#111;

    color:#fff;

    border:1px solid #333;

    font-size:13px;
    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.share-btn:hover{
    background:#fff;
    color:#000;
    border-color:#fff;
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    margin-top:32px;

    color:#666;

    font-size:11px;
}

footer strong{
    color:#aaa;
}


/* =========================
   ANIMATION
========================= */

@keyframes profileIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes linksIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .container{
        padding:
        25px 12px 40px;
    }

    .profile{
        padding-bottom:27px;
    }

    .profile-image{
        width:102px;
        height:102px;
    }

    .profile-name{
        font-size:27px;
    }

    .verified{
        width:20px;
        height:20px;
        font-size:10px;
    }

    .welcome{
        font-size:13px;
    }

    .links{
        gap:13px;
    }

    .link-card{
        min-height:72px;
        padding-left:9px;
        padding-right:50px;
    }

    .link-icon{
        width:53px;
        height:53px;
    }

    .link-icon i{
        font-size:21px;
    }

    .link-title{
        font-size:15px;
    }

    .more{
        right:18px;
    }

}


/* SMALL PHONES */

@media(max-width:350px){

    .profile-name{
        font-size:24px;
    }

    .link-title{
        font-size:14px;
    }

    .link-icon{
        width:50px;
        height:50px;
    }

}

</style>
</head>

<script>

function sharePage(){

        navigator.share({

            title:"Sudheer Kumar | Official Links",

            text:"Check out Sudheer Kumar's official links.",

            url:window.location.href

        }).catch(() => {});
